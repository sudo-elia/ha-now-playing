type: custom:flex-table-card
title: 🍿 Watchlist Series TV
entities:
  include:
    - sensor.watchlist_json_data
css:
  table: "width: 100%; border-collapse: collapse;margin:0 5rem; max-width: 100vw"
  th: >-
    background: rgba(255,255,255,0.08); padding: 10px; font-weight: bold;
    border-bottom: 2px solid rgba(255,255,255,0.2);
  td: "padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05);"
columns:
  - name: Serie
    data: series
    modify: x.title
  - name: Stagione
    data: series
    prefix: S
    align: center
    modify: x.season
  - name: Episodio
    data: series
    prefix: E
    align: center
    modify: x.episode
  - name: Dettagli
    data: series
    modify: x.rawDescription
